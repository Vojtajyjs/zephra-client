name: Build
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - run: gradle build
        working-directory: mod
      - uses: actions/upload-artifact@v4
        with: { name: mod, path: mod/build/libs/zephra-client-0.1.0.jar }
  app:
    needs: mod
    strategy:
      matrix: { os: [macos-latest, windows-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: mod, path: launcher/resources }
      - run: cp launcher/resources/zephra-client-0.1.0.jar launcher/resources/zephra-client.jar
        shell: bash
      - run: npm install && npm run dist
        working-directory: launcher
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            launcher/dist/*.dmg
            launcher/dist/*.exe
            launcher/dist/*.AppImage
  release:
    needs: app
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, pattern: app-*, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: out/* }
