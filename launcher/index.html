<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Zephra</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
*{box-sizing:border-box;margin:0}
body{height:100vh;background:#000;color:#fff;font:15px/1.5 -apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;padding:44px 56px;user-select:none}
.brand{display:flex;align-items:center;gap:12px;font-size:15px;letter-spacing:.35em;font-weight:600}
.brand svg{width:30px;height:30px}
.acct{margin-left:auto;font-size:13px;color:#888;letter-spacing:0;font-weight:400}
.acct b{color:#fff;font-weight:500;margin-right:10px}
h1{margin-top:auto;font-size:46px;line-height:1.08;font-weight:600;letter-spacing:-.02em;max-width:12ch}
p.sub{margin-top:14px;color:#888;max-width:46ch}
.opts{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:620px}
.opt{border-top:1px solid #262626;padding-top:12px;font-size:13px;color:#888}
.opt .v{color:#fff;font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:10px;align-items:center;justify-content:space-between}
input[type=range]{accent-color:#fff;width:100%;margin-top:6px}
.link{background:none;border:0;color:#fff;font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:0;white-space:nowrap}
.bar{height:2px;background:#262626;margin-top:34px;max-width:620px}
.bar i{display:block;height:100%;width:0;background:#fff;transition:width .25s}
.foot{display:flex;align-items:center;gap:20px;margin-top:16px}
button.play{background:#fff;color:#000;border:0;border-radius:999px;padding:14px 42px;font:600 15px inherit;font-family:inherit;cursor:pointer}
button.play:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
#msg{color:#888;font-size:13px}
</style></head><body>
<div class="brand">
  <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2.5 35.5 11.5v17L20 37.5 4.5 28.5v-17z" fill="none" stroke="#fff" stroke-width="2"/><path d="M13 14.5h14l-14 11h14" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
  ZEPHRA
  <div class="acct" id="acct"></div>
</div>
<h1>Minecraft, lighter.</h1>
<p class="sub">High FPS out of the box, plus a few PvP modules. Press Right Shift in game to open the module menu.</p>
<div class="opts">
  <div class="opt">Game folder<div class="v"><span id="dir"></span><button class="link" id="pick">Change</button></div></div>
  <div class="opt"><div style="display:flex;justify-content:space-between"><span>Memory</span><span id="ramv" style="color:#fff">4 GB</span></div><input id="ram" type="range" min="2" max="16" step="1" value="4"></div>
</div>
<div class="bar"><i id="fill"></i></div>
<div class="foot"><button class="play" id="play">Sign in with Microsoft</button><span id="msg"></span></div>
<script>
const $=id=>document.getElementById(id);let user=null,busy=false;
function render(){
  $('acct').innerHTML=user?`<b>${user}</b><button class="link" id="out">Sign out</button>`:'';
  $('play').textContent=user?'Play 1.21.4':'Sign in with Microsoft';
  $('play').disabled=busy;
  if(user)$('out').onclick=async()=>{await zephra.logout();user=null;render()};
}
$('ram').oninput=e=>{$('ramv').textContent=e.target.value+' GB';zephra.setRam(+e.target.value)};
$('pick').onclick=async()=>{$('dir').textContent=await zephra.pickDir()};
$('play').onclick=async()=>{
  busy=true;render();$('msg').textContent='';
  try{ if(!user){user=(await zephra.login()).name} else {await zephra.play()} }
  catch(e){$('msg').textContent=(e.message||String(e)).replace(/^Error invoking remote method '\w+': (Error: )?/,'')}
  busy=false;render();
};
zephra.onStatus(s=>{$('msg').textContent=s.text;$('fill').style.width=s.pct+'%'});
zephra.state().then(s=>{user=s.name;$('dir').textContent=s.dir;$('ram').value=s.ram;$('ramv').textContent=s.ram+' GB';render()});
</script></body></html>
